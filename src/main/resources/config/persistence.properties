# Global Digital Bank - Persistence Configuration
persistence.mode=jdbc
persistence.db.url=jdbc:sqlite:gdb.db
persistence.db.driver=org.sqlite.JDBC

# Connection pooling (HikariCP). Set enabled=false to fall back to plain DriverManager connections.
persistence.pool.enabled=true
persistence.pool.maxSize=10
persistence.pool.minIdle=2
persistence.pool.connectionTimeoutMs=30000
persistence.pool.idleTimeoutMs=600000
persistence.pool.maxLifetimeMs=1800000
# How long SQLite waits for a write lock held by another pooled connection before failing
persistence.pool.busyTimeoutMs=5000
